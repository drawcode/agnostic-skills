<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 220" width="960" height="220" role="img" aria-label="deterministic-scripts: Repeatable steps belong in scripts, not tokens.">
<title>deterministic-scripts</title>
<defs>
<pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.2" fill="#ffffff" fill-opacity=".07"/></pattern>
<radialGradient id="glow" cx="0.18" cy="0.5" r="0.45"><stop offset="0" stop-color="#62fb43" stop-opacity=".22"/><stop offset="1" stop-color="#62fb43" stop-opacity="0"/></radialGradient>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10z" fill="#9aa3ad"/></marker>
</defs>
<rect width="960" height="220" rx="20" fill="#0d1014"/>
<rect width="960" height="220" rx="20" fill="url(#dots)"/>
<rect width="960" height="220" rx="20" fill="url(#glow)"/>
<rect x="1" y="1" width="958" height="218" rx="19" fill="none" stroke="#62fb43" stroke-opacity=".3" stroke-width="2"/>
<g transform="translate(36 20)">
  <rect x="20" y="22" width="200" height="136" rx="12" fill="#11161c" stroke="#62fb43" stroke-opacity=".6" stroke-width="2"/>
  <rect x="20" y="22" width="200" height="24" rx="12" fill="#62fb43" fill-opacity=".14"/>
  <circle cx="36" cy="34" r="4" fill="#ff5f57"/><circle cx="50" cy="34" r="4" fill="#febc2e"/><circle cx="64" cy="34" r="4" fill="#28c840"/>
  <text x="34" y="72" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" fill="#62fb43">$ count --json</text>
  <text x="34" y="94" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" fill="#f4f4f2">{"files": 42,</text>
  <text x="34" y="112" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" fill="#f4f4f2"> "ok": true}</text>
  <text x="34" y="138" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" fill="#9aa3ad">exit 0</text>
  <rect x="88" y="128" width="9" height="14" fill="#62fb43"><animate attributeName="opacity" values="1;0;1" dur="1.2s" repeatCount="indefinite"/></rect>
</g>
<text x="320" y="92" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="42" font-weight="700" fill="#f4f4f2">deterministic-scripts</text>
<text x="322" y="132" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Helvetica, Arial, sans-serif" font-size="20" fill="#9aa3ad">Repeatable steps belong in scripts, not tokens.</text>
<rect x="322" y="156" width="64" height="26" rx="13" fill="#62fb43" fill-opacity=".12" stroke="#62fb43" stroke-opacity=".45"/>
<text x="354" y="173" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" fill="#62fb43">--help</text>
<rect x="396" y="156" width="64" height="26" rx="13" fill="#62fb43" fill-opacity=".12" stroke="#62fb43" stroke-opacity=".45"/>
<text x="428" y="173" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" fill="#62fb43">--json</text>
<rect x="470" y="156" width="96" height="26" rx="13" fill="#62fb43" fill-opacity=".12" stroke="#62fb43" stroke-opacity=".45"/>
<text x="518" y="173" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" fill="#62fb43">exit codes</text>
<rect x="576" y="156" width="104" height="26" rx="13" fill="#62fb43" fill-opacity=".12" stroke="#62fb43" stroke-opacity=".45"/>
<text x="628" y="173" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" fill="#62fb43">secret scan</text>
</svg>
