<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 220" width="960" height="220" role="img" aria-label="device-testing: One command set for Android and iPhone, from the terminal.">
<title>device-testing</title>
<defs>
<pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.2" fill="#ffffff" fill-opacity=".07"/></pattern>
<radialGradient id="glow" cx="0.18" cy="0.5" r="0.45"><stop offset="0" stop-color="#43e5fb" stop-opacity=".22"/><stop offset="1" stop-color="#43e5fb" stop-opacity="0"/></radialGradient>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10z" fill="#9aa3ad"/></marker>
</defs>
<rect width="960" height="220" rx="20" fill="#0d1014"/>
<rect width="960" height="220" rx="20" fill="url(#dots)"/>
<rect width="960" height="220" rx="20" fill="url(#glow)"/>
<rect x="1" y="1" width="958" height="218" rx="19" fill="none" stroke="#43e5fb" stroke-opacity=".3" stroke-width="2"/>
<g transform="translate(36 20)">
  <rect x="36" y="18" width="78" height="146" rx="14" fill="#11161c" stroke="#43e5fb" stroke-width="3"/>
  <rect x="44" y="34" width="62" height="110" rx="4" fill="#43e5fb" fill-opacity=".12"/>
  <rect x="64" y="24" width="22" height="4" rx="2" fill="#9aa3ad"/>
  <rect x="128" y="18" width="78" height="146" rx="18" fill="#11161c" stroke="#f4f4f2" stroke-width="3"/>
  <rect x="136" y="34" width="62" height="114" rx="6" fill="#f4f4f2" fill-opacity=".08"/>
  <rect x="155" y="24" width="24" height="6" rx="3" fill="#9aa3ad"/>
  <circle cx="167" cy="96" r="10" fill="#43e5fb"/>
  <circle cx="167" cy="96" r="20" fill="none" stroke="#43e5fb" stroke-width="2.5" opacity=".7"><animate attributeName="r" values="12;30" dur="1.6s" repeatCount="indefinite"/><animate attributeName="opacity" values=".8;0" dur="1.6s" repeatCount="indefinite"/></circle>
  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10" fill="#43e5fb"><text x="50" y="56">ready</text><text x="50" y="72">tap .5 .6</text><text x="50" y="88" fill="#f4f4f2">&#10003; log</text></g>
  <text x="120" y="182" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#9aa3ad">device tap play</text>
</g>
<text x="320" y="92" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="42" font-weight="700" fill="#f4f4f2">device-testing</text>
<text x="322" y="132" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Helvetica, Arial, sans-serif" font-size="20" fill="#9aa3ad">One command set for Android and iPhone, from the terminal.</text>
<rect x="322" y="156" width="72" height="26" rx="13" fill="#43e5fb" fill-opacity=".12" stroke="#43e5fb" stroke-opacity=".45"/>
<text x="358" y="173" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" fill="#43e5fb">install</text>
